[package]
name = "repair-manager"
version = "0.1.0"
description = "Repair Manager desktop application"
authors = ["Repair Manager"]
edition = "2021"

[lib]
name = "repair_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "local-offset"] }
sys-locale = "0.3"

[dev-dependencies]
tempfile = "3"
