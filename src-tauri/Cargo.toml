[package]
name = "repair-manager"
version = "1.0.1"
description = "Korigio — offline workshop repair manager"
authors = ["Moritz Alexander Wright"]
edition = "2021"
repository = "https://github.com/Korigio/korigio-desktop-app"
homepage = "https://korigio.github.io/korigio-downloads/"

[lib]
name = "repair_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["backup", "bundled"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde", "local-offset"] }
sys-locale = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
uuid = { version = "1", features = ["v4", "v7", "serde"] }
zip = "2"
sha2 = "0.10"
hex = "0.4"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "blocking"] }
tempfile = "3"
tokio = { version = "1", features = ["net", "time", "sync", "macros", "rt-multi-thread"] }
chacha20poly1305 = "0.10"
hkdf = "0.12"
rand = "0.8"
