name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux WebKit
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - name: Check version files
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            npm run version:check -- "${GITHUB_REF_NAME}"
          else
            npm run version:check
          fi

      - run: npm run typecheck
      - run: npm run lint
      - run: cargo test --lib
        working-directory: src-tauri

  build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            artifact: servioo-windows-nsis
            bundle: nsis
            path: src-tauri/target/release/bundle/nsis/*.exe
          - platform: macos-latest
            artifact: servioo-macos-dmg
            bundle: dmg
            path: src-tauri/target/release/bundle/dmg/*.dmg
          - platform: ubuntu-22.04
            artifact: servioo-linux-appimage
            bundle: appimage
            path: src-tauri/target/release/bundle/appimage/*.AppImage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux WebKit
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - run: npm ci

      - name: Build installer
        run: npm run tauri build -- --bundles ${{ matrix.bundle }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.path }}
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish private GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(dist/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No installer artifacts in dist/."
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" "${files[@]}" \
            --title "Korigio ${GITHUB_REF_NAME}" \
            --notes "Installers for Korigio ${GITHUB_REF_NAME}. Windows (NSIS) is the supported shop build. macOS and Linux are unsigned convenience builds." \
            || gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Publish public download repo
        env:
          GH_TOKEN: ${{ secrets.SERVIOO_RELEASES_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::SERVIOO_RELEASES_TOKEN is not set. Add a PAT with contents:write on Korigio/korigio-downloads or the download page will stay stale."
            exit 1
          fi
          shopt -s nullglob
          files=(dist/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No installer artifacts in dist/."
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" "${files[@]}" \
            --repo Korigio/korigio-downloads \
            --title "Korigio ${GITHUB_REF_NAME}" \
            --notes "Public download for Korigio ${GITHUB_REF_NAME}." \
            || gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --repo Korigio/korigio-downloads --clobber
          git clone --depth 1 "https://x-access-token:${GH_TOKEN}@github.com/Korigio/korigio-downloads.git" public-site
          node scripts/build-download-page.mjs --repo Korigio/korigio-downloads --output public-site/index.html
          cd public-site
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add index.html latest.json
          git diff --staged --quiet || git commit -m "docs: refresh download page for ${GITHUB_REF_NAME}"
          git push origin HEAD:main
